,"el":"","once":false,"stage":0,"common":false},{"id":31,"name":"夹缝箭","cost":1,"desc":"打 8；目标已有至少 2 霜，或本回合被打光过格挡，加 4。条件不叠加，不消耗霜。","kind":"攻","arrow":true,"el":"","once":false,"stage":1,"common":false},{"id":32,"name":"追响","cost":1,"desc":"打 7；若目标在这张牌以前已于本回合吃过至少两段伤害，抽 1。","kind":"攻","arrow":true,"el":"","once":false,"stage":1,"common":false},{"id":33,"name":"断尾","cost":1,"desc":"打 8；目标已冻结，或这一击击杀，得 4 格挡。只奖励一次。","kind":"攻","arrow":false,"el":"","once":false,"stage":1,"common":true},{"id":34,"name":"余温符","cost":1,"desc":"格挡 6；场上有带霜或灼伤的怪，再抽 1。","kind":"防","arrow":false,"el":"","once":false,"stage":1,"common":true},{"id":35,"name":"交叉火力","cost":2,"desc":"打 16；若主目标此前已在本回合受伤，再对另一只血最多的怪打 6。每场一次。","kind":"攻","arrow":true,"el":"","once":true,"stage":2,"common":false},{"id":36,"name":"收场","cost":1,"desc":"打 8；若出牌前已有两只怪在本回合倒下，返 1 费。每场一次。","kind":"攻","arrow":false,"el":"","once":true,"stage":2,"common":true},{"id":37,"name":"分裂箭","cost":1,"desc":"主箭打 5，副箭打另一只血最低的活怪 3；单怪则两段同打。只带出一次影子跟射。","kind":"攻","arrow":true,"el":"","once":false,"stage":0,"common":false},{"id":38,"name":"基础格挡","cost":1,"desc":"格挡 6。没有条件。","kind":"防","arrow":false,"el":"","once":false,"stage":0,"common":true},{"id":39,"name":"架弓","cost":1,"desc":"格挡 5。本轮第一次被攻击后再获得 3 格挡。额外格挡来不及挡第一下，专接后续攻击。","kind":"防","arrow":false,"el":"","once":false,"stage":0,"common":false},{"id":40,"name":"压阵","cost":1,"desc":"格挡 4；每个意图是攻击的敌人再给 2，最多共 8。","kind":"防","arrow":false,"el":"","once":false,"stage":0,"common":true},{"id":41,"name":"霜幕","cost":1,"desc":"格挡 5，给一只本轮准备攻击的敌人叠 1 霜；没攻击意图的目标也可单独打出拿格挡。","kind":"防","arrow":false,"el":"冰","once":false,"stage":1,"common":true},{"id":42,"name":"续守","cost":1,"desc":"格挡 6；下个玩家回合开始，再得 3 格挡。","kind":"防","arrow":false,"el":"","once":false,"stage":1,"common":true},{"id":43,"name":"反手箭","cost":1,"desc":"格挡 6；本轮第一次用格挡吸收伤害时，对攻击者还一箭 4。反击不算主动出牌，不触发跟射。","kind":"防","arrow":false,"el":"","once":false,"stage":1,"common":false},{"id":44,"name":"重防","cost":2,"desc":"格挡 14。专门挡重击，不要求手里还有别的防牌。","kind":"防","arrow":f  const Engine=(()=>{
const byId=Object.fromEntries(CARDS.map(c=>[c.id,c]));
const STAGES=[
 {name:'前期',subtitle:'蜕壳地 · 基础攻防',spawns:[['背风甲虫',24,[5,-4,7]],['活石守卫',32,[0,12,7]]]},

 {name:'后期',subtitle:'合脊 · 猎月终击',spawns:[['合脊巨岩',78,[10,-7,17,0,[7,7]],true]]}
];
const enemy=(r,i)=>({id:i,name:r[0],hp:r[1],max:r[1],moves:r[2],boss:!!r[3],guard:0,frost:0,locked:false,burn:0,hits:0,broke:false,weaken:0});
const clone=s=>JSON.parse(JSON.stringify(s));
function rnd(s){s.rng=(Math.imul(s.rng,1664525)+1013904223)>>>0;return s.rng/4294967296}
function shuffle(s,a){for(let i=a.length-1;i>0;i--){let j=Math.floor(rnd(s)*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const live=s=>s.enemies.filter(e=>e.hp>0);
const low=es=>es.slice().sort((a,b)=>a.hp-b.hp||a.id-b.id)[0];
const high=es=>es.slice().sort((a,b)=>b.hp-a.hp||a.id-b.id)[0];
const get=(s,i)=>s.enemies.find(e=>e.id===i&&e.hp>0);
const move=(s,e)=>e.moves[(s.turn-1)%e.moves.length];
function log(s,t){s.lines.unshift('R'+s.turn+' · '+t);if(s.lines.length>42)s.lines.pop()}
function done(s){if(s.hp<=0){if(!s.result)log(s,'战斗结束');s.result='输'}else if(!live(s).length){if(!s.result)log(s,'房间已清理');s.result='赢'}return !!s.result}
function dealt(s,e,n,label){if(!e||e.hp<=0||n<=0)return {kill:false,overflow:0};const g=Math.min(e.guard,n),net=n-g,loss=Math.min(net,e.hp);e.guard-=g;
 if(g&&e.guard===0)e.broke=true;
 e.hp-=loss;if(loss)e.hits++;if(e.hp<=0)s.kills++;
 log(s,label+' → '+e.name+' '+(loss?'−'+loss+' HP':'0 HP')+(g?'（护甲 −'+g+'）':'')+(!e.hp?' · 击倒':''));
 return {kill:!e.hp,overflow:Math.max(0,net-loss)}
}
function strip(s,e,n){if(!e||!e.guard)return 0;const v=Math.min(n,e.guard);e.guard-=v;if(!e.guard)e.broke=true;log(s,e.name+' 护甲 −'+v);return v}
function frost(s,e){if(!e||!e.hp||e.locked)return;if(++e.frost>=3){e.frost=0;e.locked=true;log(s,e.name+(e.boss?' · 霜裂（下一击 −4）':' · 冻结（跳过下一次攻击）'))}}
function burn(s,e,n){if(e?.hp)e.burn=Math.min(6,e.burn+n)}
function takeBurn(s,e){const n=e.burn;e.burn=0;if(!n||!e.hp)return false;const loss=Math.min(e.hp,n);e.hp-=loss;e.hits++;if(!e.hp)s.kills++;log(s,'灼伤 → '+e.name+' −'+loss+' HP'+(!e.hp?' · 击倒':''));return !e.hp}
function peak(s){if(!s.deck.length&&s.bin.length)s.deck=shuffle(s,s.bin.splice(0));return s.deck.shift()}
function draw(s,n){while(n--){const c=peak(s);if(c!==undefined)s.hand.push(c)}}
function pickTwo(s,want){const a=peak(s),b=peak(s);if(a===undefined)return;if(b===undefined){s.hand.push(a);return}if(want===1){s.hand.push(b);s.deck.push(a)}else{s.hand.push(a);s.deck.push(b)}log(s,'选入 '+byId[want===1?b:a].name)}
function offer(s){const m=clone(s);return [peak(m),peak(m)].filter(x=>x!==undefined)}
function makeDeck(s){
 let out=[];
 for(const [kind,n] of [['攻',10],['防',6],['功能',2]]){
  const available=CARDS.filter(c=>c.kind===kind&&c.stage<=s.stage);
  const higher=available.filter(c=>c.stage===s.stage);
  const base=available.filter(c=>c.stage<s.stage);
  shuffle(s,higher);shuffle(s,base);
  if(s.stage===0){let a=shuffle(s,available.slice());while(a.length<n)a.push(...shuffle(s,available.slice()));out.push(...a.slice(0,n).map(c=>c.id));continue}
  let quota=Math.min(higher.length,kind==='攻'?3:kind==='防'?2:1);
  const hit=higher.slice(0,quota);const rest=shuffle(s,base.concat(higher.slice(quota)));
  while(hit.length<n)hit.push(...rest.slice(0,n-hit.length));
  out.push(...hit.map(c=>c.id))
 }
 return shuffle(s,out)
}
function room(stage,seed,core='冰'){
 let s={stage,seed,rng:seed>>>0,hp:56,max:56,turn:1,ap:3,guard:0,deck:[],bin:[],hand:[],gone:[],used:[],enemies:STAGES[stage].spawns.map(enemy),lines:[],lamp:null,charges:1,core:stage?core:'无',shadow:null,last:-1,kills:0,waveKill:false,retain:[],afterGuard:0,counter:0,cap:false,carry:0,returnLamp:0,result:'',actions:0};
 s.deck=makeDeck(s);draw(s,6);log(s,'新开局：'+STAGES[stage].name);return s
}
function lamp(s){
 if(s.result||s.ap<1||s.charges<1||s.lamp)return false;
 s.ap--;s.actions++;s.charges--;s.lamp={waves:2,el:''};

}
function wave(s){
 if(!s.lamp||s.lamp.waves<1||!live(s).length)return false;
 const el=s.lamp.el||s.core;const last=s.kills;
 for(const e of live(s)){dealt(s,e,4,el==='无'?'余光':el+'波');if(el==='冰')frost(s,e);if(el==='火')burn(s,e,2)}

 s.lamp.el='';
 if(--s.lamp.waves===0){s.lamp=null;if(s.stage===2)dealt(s,get(s,s.last)||high(live(s)),8,'猎月')}
 return true
}
function valid(s,c){return c&&!s.result&&s.hand.includes(c.id)&&s.ap>=c.cost&&(!c.once||!s.used.includes(c.id))}
const needs=c=>c.kind==='攻'||c.id===41;
function play(s,id,who=-1,arg={}){
 const c=byId[id];if(!valid(s,c))return false;
 let e=get(s,who);
 if(needs(c)&&!e&&id!==41)return false;
 s.ap-=c.cost;s.actions++;s.hand.splice(s.hand.indexOf(id),1);if(c.once)s.used.push(id);
 const echo=c.arrow&&s.shadow&&!s.shadow.shot;
 if(needs(c)&&id!==41&&e)s.last=e.id;
 if(s.lamp&&c.el)s.lamp.el=c.el;
 const H=(n,t=c.name)=>dealt(s,e,n,t);
 const B=n=>{s.guard+=n;log(s,c.name+' · 格挡 +'+n)};
 let r, a, t;
 switch(id){
 case 1:H(8);break;
 case 2:H(6);draw(s,1);break;
 case 3:B(5);draw(s,1);break;
 case 4:H(7);frost(s,e);break;
 case 5:strip(s,e,2);H(7);break;
 case 6:H(6);burn(s,e,2);break;
 case 7:H(8);if(!s.hand.some(x=>byId[x].kind==='攻'))draw(s,1);break;
 case 8:pickTwo(s,arg.choice);break;
 case 9:H(7);if(e.hp)e.weaken+=3;break;
 case 10:H(e.hp*2<=e.max?12:8);break;
 case 11:a=e.frost>=2;if(a)e.frost-=2;H(8);if(a)H(6,'碎霜追加');break;
 case 12:a=e.guard;strip(s,e,6);if(a&&!e.guard)draw(s,1);H(6);break;
 case 13:H(7);if(takeBurn(s,e))draw(s,1);break;
 case 14:if(H(8).kill)draw(s,1);break;
 case 15:B(6);wave(s);break;
 case 16:B(5);if(!s.shadow)s.shadow={hp:3,max:3,until:s.turn+1,shot:false,intercept:false};break;
 case 17:B(6);if(Number.isInteger(arg.hold)&&s.hand[arg.hold]!==undefined){s.retain.push(s.hand.splice(arg.hold,1)[0]);log(s,'留牌到下回合')}break;
 case 18:t=get(s,arg.to) || e;H(9);if(t.hp>0)dealt(s,t,9,'穿群第二发');break;
 case 19:H(8);if(s.ap===0){a=peak(s);if(a!==undefined){s.retain.push(a);log(s,'留牌：'+byId[a].name)}}break;
 case 20:r=H(8);if(r.kill)dealt(s,low(live(s)),r.overflow,'溢伤');break;
 case 21:H(8);while(s.lamp&&live(s).length)wave(s);break;
 case 22:a=e.locked;H(14);if(a)for(const f of live(s))dealt(s,f,6,'断层余击');break;
 case 23:B(7);if(s.shadow)s.shadow.intercept=true;break;
 case 24:if(H(16).kill){s.ap++;log(s,'终猎 · 返 1 AP')}break;
 case 25:a=!!s.shadow?.shot;H(8);if(a)dealt(s,get(s,who)||low(live(s)),8,'复弦影箭');break;
 case 26:B(6);if(s.waveKill)s.returnLamp=1;break;
 case 27:H(7);if(!s.shadow)s.shadow={hp:1,max:1,until:s.turn+1,shot:false,intercept:false};break;
 case 28:a=e.frost||e.burn||e.locked;H(6);if(a)pickTwo(s,arg.choice);else draw(s,1);break;
 case 29:B(6);if(s.shadow){a=Math.min(2,7-s.shadow.max);s.shadow.max+=a;s.shadow.hp+=a}break;
 case 30:H(6);B(3);break;
 case 31:H(e.frost>=2||e.broke?12:8);break;
 case 32:a=e.hits>=2;H(7);if(a)draw(s,1);break;
 case 33:a=e.locked;if(H(8).kill||a)B(4);break;
 case 34:B(6);if(live(s).some(f=>f.frost||f.locked||f.burn))draw(s,1);break;
 case 35:a=e.hits>0;H(16);if(a)dealt(s,high(live(s).filter(x=>x.id!==who)),6,'交叉追击');break;
 case 36:a=s.kills>=2;H(8);if(a){s.ap++;log(s,'收场 · 返 1 AP')}break;
 case 37:t=low(live(s).filter(f=>f.id!==who))||e;H(5);if(t.hp>0)dealt(s,t,3,'分裂副箭');break;
 case 38:B(6);break;
 case 39:B(5);s.afterGuard+=3;break;
 case 40:B(Math.min(8,4+2*live(s).filter(f=>{const m=move(s,f);return Array.isArray(m)||m>0}).length));break;
 case 41:B(5);if(e){a=move(s,e);if(a>0||Array.isArray(a))frost(s,e)}break;
 case 42:B(6);s.carry+=3;break;
 case 43:B(6);s.counter+=4;break;
 case 44:B(14);break;
 case 45:B(6);s.cap=true;break;
 default:throw Error('Unimplemented card '+id)
 }
 if(echo&&s.shadow){s.shadow.shot=true;dealt(s,get(s,who)||low(live(s)),3,'影子跟射')}
 if(c.once)s.gone.push(id);else s.bin.push(id);
 done(s);return true
}
function end(s){
 if(s.result)return false;
 for(const e of live(s)){
  if(takeBurn(s,e))continue;
  const m=move(s,e);
  if(!Array.isArray(m)&&m<=0){if(m<0){e.guard=-m;log(s,e.name+' 架盾 '+(-m))}else log(s,e.name+' 蓄势');continue}
  if(e.locked&&!e.boss){e.locked=false;e.weaken=0;log(s,e.name+' 冻结 · 跳过攻击');continue}
  const parts=Array.isArray(m)?m.slice():[m];let reduce=(e.locked?4:0)+e.weaken;e.locked=false;e.weaken=0;
  for(let n of parts){
   if(s.hp<=0||!e.hp)break;const red=Math.min(reduce,n);reduce-=red;n-=red;if(n<=0)continue;
   let retaliation=false;
   if(s.shadow?.intercept){const v=Math.min(n,s.shadow.hp);s.shadow.hp-=v;n-=v;s.shadow.intercept=false;retaliation=true;log(s,'影子分担 '+v);if(!s.shadow.hp)s.shadow=null}
   const g=Math.min(s.guard,n);s.guard-=g;n-=g;
   if(n&&s.cap){n=Math.min(n,5);s.cap=false}
   s.hp=Math.max(0,s.hp-n);log(s,e.name+' → 弓手 '+(n?'−'+n+' HP':'未掉血')+(g?'（挡 '+g+'）':''));
   if(s.afterGuard){s.guard+=s.afterGuard;log(s,'架弓 · 追加格挡 '+s.afterGuard);s.afterGuard=0}
   if(retaliation&&s.hp>0)dealt(s,e,6,'影返');
   if(g&&s.counter&&s.hp>0){dealt(s,e,s.counter,'反手箭');s.counter=0}
  }
  if(s.hp<=0)break
 }
 if(done(s))return true;
 if(s.shadow?.until<=s.turn)s.shadow=null;
 s.turn++;s.ap=3;s.guard=s.carry;s.carry=0;s.cap=false;s.afterGuard=0;s.counter=0;s.kills=0;s.waveKill=false;
 if(s.shadow){s.shadow.shot=false;s.shadow.intercept=false}
 if(s.returnLamp){s.charges+=s.returnLamp;s.returnLamp=0}
 for(const e of live(s)){e.hits=0;e.broke=false}
 if(s.stage===1&&s.turn===2){s.enemies.push(enemy(['碎壳哨兵',16,[0,7,8,-4]],1),enemy(['岩缝猎虫',16,[0,6,7,-4]],2));log(s,'两只增援进场')}
 s.bin.push(...s.hand.splice(0));s.hand=s.retain.splice(0);draw(s,6);
 wave(s);done(s);return true
}
return {STAGES,byId,room,clone,live,move,play,end,lamp,offer,valid,needs,log}
})();

 const A=document.querySelector('#app');
const POOL=document.querySelector('#pool');
const LOG=document.querySelector('#log');
const newSeed=()=>crypto.getRandomValues(new Uint32Array(1))[0]||1;
let seed=newSeed(),stage=0,core='冰',s=Engine.room(stage,seed,core),snapshot=Engine.clone(s),sel=null,first=null,dialog=null,notice='';
const card=x=>Engine.byId[x];
function init(st=stage,n=seed){stage=st;seed=n;s=Engine.room(stage,seed,core);snap();clear();notice='';render()}
function snap(){snapshot=Engine.clone(s)}
function clear(){sel=null;first=null;dialog=null}
const elName=x=>x&&x!=='无'?x+'波':'余光';
function btn(t,a,opts=''){return '<button type="button" data-a="'+a+'" '+opts+'>'+t+'</button>'}
function selectAttr(x){return 'aria-pressed="'+x+'"'}
function active(){return sel!==null?s.hand[sel]:undefined}
function render(){
 const room=Engine.STAGES[stage],ready=sel!==null;
 const cols=[[6,2],[7,1],[7,3]],party=[];
 party.push('<div class="tile hero" style="grid-area:2 / 2">弓手<span class="tag">'+s.hp+'/'+s.max+' HP'+(s.guard?' · 挡 '+s.guard:'')+'</span></div>');
 if(s.shadow)party.push('<div class="tile shadow" style="grid-area:3 / 2">影子<span class="tag">'+s.shadow.hp+'/'+s.shadow.max+' HP'+(s.shadow.shot?' · 已跟射':'')+'</span></div>');
 if(s.lamp)party.push('<div class="tile lamp" style="grid-area:2 / 4">灯<span class="tag">'+elName(s.lamp.el||s.core)+' · '+('●'.repeat(s.lamp.waves))+('○'.repeat(2-s.lamp.waves))+'</span></div>');
 for(const e of s.enemies){
  const m=Engine.move(s,e),intent=Array.isArray(m)?m.join('＋')+' 连击':m>0?'攻击 '+m:m<0?'架盾 '+(-m):'蓄势';
  const [x,y]=cols[e.id],info=(e.guard?' · 挡'+e.guard:'')+(e.locked?(e.boss?' · 霜裂':' · 冻结'):(e.frost?' · 霜'+e.frost:''))+(e.burn?' · 灼'+e.burn:'');
  party.push('<button class="tile foe '+(ready?'target ':'')+(first===e.id?'extra ':'')+(!e.hp?'dead':'')+'" style="grid-area:'+y+' / '+x+'" data-a="foe:'+e.id+'" '+(!e.hp||s.result?'disabled':'')+'><span>'+e.name+'</span><span class="tag">'+e.hp+'/'+e.max+' HP'+info+'</span><span class="tag note">'+intent+'</span></button>');
 }
 let hint=notice||'点攻击牌再点怪。防御直接出。';
 if(dialog?.type==='pick')hint='从顶牌选一张入手，另一张放底。';
 else if(dialog?.type==='hold')hint='选一张牌留到下回合。';
 else if(active()===18&&first!==null)hint='再点第二发目标，可点同一只。';
 else if(ready)hint='已选「'+card(active()).name+'」，点目标结算。';
 else if(stage===1&&s.turn===1&&!s.result)hint+=(notice?' · ':' ')+'下一回合有两只增援。';
 const choices=dialog?'<div class="row">'+dialog.items.map((q,i)=>btn(card(q).name,'choice:'+i)).join('')+btn('取消','cancel')+'</div>':'';
 const coreUI=stage>0?'<label>灯芯 <select id="core" '+(s.actions||s.turn>1||s.result?'disabled':'')+'>'+['冰','电','火','无'].map(v=>'<option '+(v===s.core?'selected':'')+'>'+v+'</option>').join('')+'</select></label>':'';
 A.innerHTML='<div class="row stages">'+Engine.STAGES.map((q,i)=>btn(q.name,'stage:'+i,selectAttr(stage===i))).join('')+'<span class="tail seed hint">牌序 '+seed+'</span>'+btn('换一套随机牌','reroll')+btn('重开本关','restart')+'</div>'+
 '<div class="row status"><b>'+room.subtitle+'</b><span class="hint">第 '+s.turn+' 回合</span>'+coreUI+(stage===2?'<span class="badge">猎月已解锁</span>':'')+'</div>'+
 '<div class="board '+(s.lamp?'lit':'')+'" aria-label="方格战斗区">'+party.join('')+'</div>'+
 '<div class="actions"><b class="stretch">'+(s.result?(s.result==='赢'?'本关通过':'本关失败'):(s.ap+' / 3 AP'))+'</b>'+
 (s.result?(s.result==='赢'&&stage<2?btn('下一阶段','next','class="primary"'):btn('再开一把','reroll','class="primary"')):btn('开灯 · 1 AP','lamp',(!s.charges||s.lamp||!s.ap?'disabled ':'')+'class="primary"')+btn('重试本回合','retry')+btn('结束回合','end','class="primary"'))+'</div>'+
 '<div id="message" aria-live="polite">'+hint+'</div>'+choices+
 '<div class="row"><b>手牌 '+s.hand.length+'</b><small>牌库 '+s.deck.length+' · 弃牌 '+s.bin.length+' · 本场已消耗 '+s.gone.length+'</small></div>'+
 '<div class="hand">'+s.hand.map((id,i)=>{const q=card(id);return btn('<span class="fee">'+q.cost+' AP · '+q.kind+(q.el?' · '+q.el:'')+'</span><b>'+q.name+'</b><span class="desc">'+q.desc+'</span>','card:'+i,'class="card" '+selectAttr(sel===i)+(Engine.valid(s,q)?'':' disabled'))}).join('')+'</div>';
 LOG.innerHTML=s.lines.map(x=>'<li>'+x+'</li>').join('');
}
function checkResult(ok){if(ok){notice=s.lines[0]||'';clear()}render()}
function chooseCard(i){
 const id=s.hand[i],q=card(id);
 if(!Engine.valid(s,q))return;
 if(sel===i){clear();render();return}
 clear();sel=i;
 if(id===8||id===17){
  const items=id===8?Engine.offer(s):s.hand.filter((_,k)=>k!==i);
  if(items.length>1){dialog={type:id===8?'pick':'hold',items,id};render();return}
  checkResult(Engine.play(s,id,-1,{choice:0,hold:items.length?0:undefined}));return
 }
 if(id===41){const options=Engine.live(s).filter(e=>{const v=Engine.move(s,e);return v>0||Array.isArray(v)}); if(!options.length){checkResult(Engine.play(s,id));return}if(options.length===1){checkResult(Engine.play(s,id,options[0].id));return}}
 if(Engine.needs(q)){render();return}
 checkResult(Engine.play(s,id));
}
A.addEventListener('click',ev=>{
 const button=ev.target.closest('button[data-a]');if(!button||button.disabled)return;
 const [act,val]=button.dataset.a.split(':'),n=Number(val);
 if(act==='stage'){init(n,newSeed());return}
 if(act==='reroll'){init(stage,newSeed());return}
 if(act==='restart'){init();return}
 if(act==='next'){init(Math.min(2,stage+1),newSeed());return}
 if(act==='cancel'){clear();notice='';render();return}
 if(act==='retry'){s=Engine.clone(snapshot);clear();notice='已回到本回合开始';render();return}
 if(act==='lamp'){checkResult(Engine.lamp(s));return}
 if(act==='end'){if(Engine.end(s)){snap();clear();notice=s.lines[0]||'';render()}return}
 if(act==='card'){chooseCard(n);return}
 if(act==='choice'&&dialog){
  const old=dialog;
  if(old.type==='hold'){checkResult(Engine.play(s,old.id,-1,{hold:n}));return}
  checkResult(Engine.play(s,old.id,old.who??-1,{choice:n}));return
 }
 if(act==='foe'){
  const id=active();if(id===undefined||dialog)return;
  if(id===18&&first===null){first=n;render();return}
  if(id===28){const e=Engine.live(s).find(x=>x.id===n),items=Engine.offer(s);if(e&&(e.frost||e.locked||e.burn)&&items.length>1){dialog={type:'pick',items,id,who:n};render();return}}
  checkResult(Engine.play(s,id,first===null?n:first,{to:n}));
 }
});
A.addEventListener('change',e=>{if(e.target.id==='core'&&!s.actions&&s.turn===1){core=e.target.value;s.core=core;snap();render()}});
POOL.innerHTML=CARDS.map(q=>'<div><b>'+q.name+'</b> · '+q.cost+' AP <small>'+Engine.STAGES[q.stage].name+(q.common?' · 通用':'')+'</small><br>'+q.desc+'</div>').join('');
render();

</script></body></html>
