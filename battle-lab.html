function clear(){sel=null;first=null;dialog=null}
const elName=x=>x&&x!=='无'?x+'波':'余光';
function btn(t,a,opts=''){return '<button type="button" data-a="'+a+'" '+opts+'>'+t+'</button>'}
function selectAttr(x){return 'aria-pressed="'+x+'"'}
function active(){return sel!==null?s.hand[sel]:undefined}
function delta(fn){const h=s.hp, prior=Object.fromEntries(s.enemies.map(e=>[e.id,e.hp]));const ok=fn();if(ok){fx={hero:h-s.hp};for(const e of s.enemies)fx[e.id]=(prior[e.id]??e.max)-e.hp}return ok}
const pop=n=>n>0?'<span class="float" aria-hidden="true">−'+n+'</span>':'';
const meter=(hp,max)=>'<span class="meter" aria-hidden="true"><i style="width:'+Math.round(100*hp/max)+'%"></i></span>';
const unitUnder=(name,hp,max,extra='')=>'<span class="under"><span class="name">'+name+'</span>'+meter(hp,max)+'<span class="numbers">'+hp+'/'+max+' HP'+extra+'</span></span>';
const terrain='<svg class="terrain" viewBox="0 0 1100 345" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path fill="#272131" d="M0 0h1100v345H0z"/><path fill="#493949" d="m0 165 106-72 61 18 67-41 108 63 48 8 99-66 105 78L721 87l60 20 83-63 98 45 138-11v171H0z"/><path fill="#342939" d="m0 169 98-25 35 13 87-51 95 61 59-14 119 31 118-52 126 40 82-39 70-47 54 51 157 19v153H0z"/><path fill="#4a3d4e" d="m0 226 174-13 99-17 204 6 95-10 256 10 272 19v124H0z"/><path fill="#594b5a" d="m0 238 258-31 219-5 234 2 191 11 198 20v48l-209-30-228-14-222 4-266 21L0 284z"/><path fill="#302635" d="M0 307l299-53 87 5 144-18 86 17 132 6 181 24 171 13v44H0z"/><path d="M27 207l92-30m20 13 60-42m95 30 43 12m91-32 64-34m123 77 62-24m64-13 104-40m39 8 70 14M25 254l141-19m75 26 91-9m482 3 111 14m32-49 51 7M229 312l128-28m407-4 155 28" fill="none" stroke="#8d747e" stroke-opacity=".53" stroke-width="2"/><path d="M45 229q115-14 221-23m542 29q102 1 187 19M100 299q230-50 399-51m66 35q207-4 451 37" fill="none" stroke="#b79a87" stroke-opacity=".3" stroke-width="3"/></svg>';
function render(){
 const room=Engine.STAGES[stage],ready=sel!==null&&Engine.needs(card(active()))&&!dialog,arming=s.burst>=s.turn;
 const allies='<div class="unit hero" aria-label="弓手">'+ART.archer+unitUnder('弓手',s.hp,s.max,s.guard?' · 挡 '+s.guard:'')+pop(fx.hero)+'</div>'+
 (s.shadow?'<div class="unit shadow-unit">'+ART.shadow+unitUnder('影子',s.shadow.hp,s.shadow.max,s.shadow.shot?' · 已跟射':' · 可跟射')+'</div>':'');
 const lamp=s.lamp?'<div class="unit lamp-unit">'+ART.lantern+'<span class="under"><span class="name">灯</span><span class="numbers">'+elName(s.lamp.el||s.core)+' · '+('●'.repeat(s.lamp.waves))+('○'.repeat(2-s.lamp.waves))+'</span></span></div>':'';
 const foes=s.enemies.filter(e=>e.hp||fx[e.id]).map(e=>{
  const m=Engine.move(s,e),intent=Array.isArray(m)?m.join('＋')+' 连击':m>0?'攻击 '+m:m<0?'架盾 '+(-m):'蓄势';
  const info=(e.guard?' · 挡'+e.guard:'')+(e.locked?(e.boss?' · 霜裂':' · 冻结'):(e.frost?' · 霜'+e.frost:''))+(e.burn?' · 灼'+e.burn:'');
  const art=e.boss?ART.boss:/甲虫|猎虫/.test(e.name)?ART.beetle:/精英/.test(e.name)?ART.boss:ART.guard;
  return '<button class="unit foe '+(ready&&e.hp?'target ':'')+(first===e.id?'first ':'')+(e.boss?'boss ':'')+(!e.hp?'dead':'')+'" data-a="foe:'+e.id+'" '+(!e.hp||s.result?'disabled':'')+'>'+art+unitUnder(e.name,e.hp,e.max,info)+'<span class="intent">'+(e.hp?intent:'已击倒')+'</span>'+pop(fx[e.id])+'</button>'
 }).join('');
 let hint=notice||'攻击牌 → 点怪；格挡直接用。';
 if(dialog?.type==='pick')hint='选一张入手，另一张放牌库底。';
 else if(dialog?.type==='hold')hint='选一张牌留到下回合。';
 else if(active()===18&&first!==null)hint='再点第二发目标，可以是同一只。';
 else if(ready)hint='已选「'+card(active()).name+'」，点击发亮的怪。';
 else if(arming)hint='裂光已附着。现在打一张武器牌，碎光就会炸开。';
 else if(stage===1&&s.turn===1&&!s.result)hint+=(notice?' · ':' ')+'下一回合有两只增援。';
 const choices=dialog?'<div class="row choices">'+dialog.items.map((q,i)=>btn(card(q).name,'choice:'+i)).join('')+btn('取消','cancel')+'</div>':'';
 const coreUI=stage>0&&mode!=='burst'?'<label class="action-slim">灯芯 <select id="core" '+(s.actions||s.turn>1||s.result?'disabled':'')+'>'+['冰','电','火','无'].map(v=>'<option '+(v===s.core?'selected':'')+'>'+v+'</option>').join('')+'</select></label>':'';
 const label=mode==='burst'?'开灯对照：关闭':'开灯对照：开启';
 A.innerHTML='<div class="row stages">'+Engine.STAGES.map((q,i)=>btn(q.name,'stage:'+i,selectAttr(stage===i))).join('')+'<span class="tail seed hint">牌序 '+seed+'</span>'+btn(label,'mode','class="action-slim" title="切换后用同一牌序重开"')+btn('换随机手牌','reroll','class="action-slim"')+'</div>'+
 '<div class="row status"><b>'+room.subtitle.replace(' · 猎月终击',' · 首领战')+'</b><span class="hint">第 '+s.turn+' 回合</span>'+coreUI+(stage===2&&mode!=='burst'?'<span class="badge">猎月已解锁</span>':'')+'</div>'+
 '<div class="arena '+(s.lamp?'lit ':'')+(ready?'picking':'')+'" aria-label="战斗场景">'+terrain+'<div class="field-glow"></div><div class="hero-zone zone-zone">'+allies+'</div><div class="zone-zone">'+lamp+'</div><div class="foe-zone zone-zone">'+foes+'</div></div>'+
 '<div class="steps" aria-live="polite"><b class="step">出牌提示</b><span class="arrowhint">›</span><span class="signal">'+hint+'</span></div>'+choices+
 '<div class="actions"><b class="stretch">'+(s.result?(s.result==='赢'?'本关通过':'本关失败'):'<span class="ap-dots" aria-hidden="true">'+('●'.repeat(Math.max(0,s.ap)))+('○'.repeat(Math.max(0,3-s.ap)))+'</span>'+s.ap+' / 3 AP')+'</b>'+
 (s.result?(s.result==='赢'&&stage<2?btn('下一阶段','next','class="end-action"'):btn('再开一把','reroll','class="end-action"')):(mode!=='burst'?btn('开灯 · 0 AP','lamp',(!s.charges||s.lamp?'disabled ':'')+'class="primary"'):'')+btn('重试本回合','retry','class="action-slim"')+btn('结束回合','end','class="end-action"'))+'</div>'+
 '<div class="row hand-title"><b>手牌 '+s.hand.length+'</b><small>牌库 '+s.deck.length+' · 弃牌 '+s.bin.length+'</small></div>'+
 '<div class="hand">'+s.hand.map((id,i)=>{
  const q=card(id),type=q.kind==='防'?'格挡':q.kind==='功能'?'技巧':q.id===46?'法术':Engine.weapon(q)?'武器':'法术';
  const cls=q.kind==='防'?'def':q.kind==='功能'||q.id===46?'util':'atk';
  const description=q.desc.replace(/(\d+(?:\s*AP)?)/g,'<strong>$1</strong>');
  return btn('<span class="card-art">'+mark(q.id===46?'magic':pictogram(q))+'<span class="fee" title="AP 费用">'+q.cost+'</span><span class="type">'+type+'</span></span><span class="card-copy"><b>'+q.name+'</b><span class="desc">'+description+'</span></span>','card:'+i,'class="card '+cls+'" '+selectAttr(sel===i)+(Engine.valid(s,q)?'':' disabled'))
 }).join('')+'</div>'+
 '<p class="caption hint">试连招：影子上场 → 裂光术 → 任意弓箭。没有影子，武器照样能引爆。</p>'+btn('用同样的牌重开','restart','class="action-slim"');
 LOG.innerHTML=s.lines.map(x=>'<li>'+x+'</li>').join('');
}
function checkResult(ok){if(ok){notice=s.lines[0]||'';clear()}render()}
function play(id,w=-1,arg={}){checkResult(delta(()=>Engine.play(s,id,w,arg)))}
function chooseCard(i){
 const id=s.hand[i],q=card(id);
 if(!Engine.valid(s,q))return;
 if(sel===i){clear();render();return}
 clear();sel=i;fx={};
 if(id===8||id===17){
  const items=id===8?Engine.offer(s):s.hand.filter((_,k)=>k!==i);
  if(items.length>1){dialog={type:id===8?'pick':'hold',items,id};render();return}
  play(id,-1,{choice:0,hold:items.length?0:undefined});return
 }
 if(id===41){const options=Engine.live(s).filter(e=>{const v=Engine.move(s,e);return v>0||Array.isArray(v)});if(!options.length){play(id);return}if(options.length===1){play(id,options[0].id);return}}
 if(Engine.needs(q)){render();return}
 play(id)
}
A.addEventListener('click',ev=>{
 const button=ev.target.closest('button[data-a]');if(!button||button.disabled)return;
 const [act,val]=button.dataset.a.split(':'),n=Number(val);
 if(act==='stage'){init(n,newSeed());return}
 if(act==='reroll'){init(stage,newSeed());return}
 if(act==='restart'){init();return}
 if(act==='mode'){mode=mode==='combo'?'burst':'combo';init();return}
 if(act==='next'){init(Math.min(2,stage+1),newSeed());return}
 if(act==='cancel'){clear();notice='';render();return}
 if(act==='retry'){s=Engine.clone(snapshot);clear();fx={};notice='已回到本回合开始';render();return}
 if(act==='lamp'){checkResult(delta(()=>Engine.lamp(s)));return}
 if(act==='end'){if(delta(()=>Engine.end(s))){snap();clear();notice=s.lines[0]||'';render()}return}
 if(act==='card'){chooseCard(n);return}
 if(act==='choice'&&dialog){
  const old=dialog;
  if(old.type==='hold'){play(old.id,-1,{hold:n});return}
  play(old.id,old.who??-1,{choice:n});return
 }
 if(act==='foe'){
  const id=active();if(id===undefined||dialog)return;
  if(id===18&&first===null){first=n;render();return}
  if(id===28){const e=Engine.live(s).find(x=>x.id===n),items=Engine.offer(s);if(e&&(e.frost||e.locked||e.burn)&&items.length>1){dialog={type:'pick',items,id,who:n};render();return}}
  play(id,first===null?n:first,{to:n});
 }
});
A.addEventListener('change',e=>{if(e.target.id==='core'&&!s.actions&&s.turn===1){core=e.target.value;s.core=core;snap();render()}});
POOL.innerHTML=CARDS.map(q=>'<div><b>'+q.name+'</b> · '+q.cost+' AP <small>'+(q.experimental?'联动试验':Engine.STAGES[q.stage].name)+(q.common?' · 通用':'')+'</small><br>'+q.desc+'</div>').join('');
render();

</script></body></html>
